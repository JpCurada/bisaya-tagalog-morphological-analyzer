version: '3.8'

services:
  bistag:
    build: .
    container_name: bistag-analyzer
    ports:
      - "8000:8000"
    volumes:
      # Mount data directory for easy updates
      - ./data:/app/data:ro
      # Mount web directory for development
      - ./web:/app/web:ro
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
